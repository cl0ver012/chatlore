[project]
name = "chatlore"
version = "0.1.0"
description = "All your AI conversations, one graph, one chat. A local-first graph knowledge base built from ChatGPT, Claude, and Gemini exports."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "cl0ver012" }]
keywords = [
  "knowledge-graph",
  "rag",
  "chatgpt",
  "claude",
  "gemini",
  "mcp",
  "personal-knowledge-base",
  "local-first",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "fastapi>=0.141",
  "fastembed>=0.4",
  "mcp>=2.2",
  "networkx>=3.7",
  "openai>=3.17",
  "pydantic>=2.9",
  "python-dotenv>=1.2",
  "pyyaml>=6.0",
  "rich>=13.7",
  "sqlite-vec>=0.1.6",
  "typer>=0.15",
  "uvicorn>=0.53",
]

[project.urls]
Homepage = "https://github.com/cl0ver012/chatlore"
Repository = "https://github.com/cl0ver012/chatlore"
Issues = "https://github.com/cl0ver012/chatlore/issues"
Changelog = "https://github.com/cl0ver012/chatlore/blob/main/CHANGELOG.md"

[project.scripts]
chatlore = "chatlore.cli:run"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatlore"]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.11",
  "pre-commit>=4",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.16",
  "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
  "SIM", # simplify
  "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
pretty = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sqlite_vec", "fastembed", "networkx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["chatlore"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
