name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Install the wheel and try the demo
        run: |
          wheel=$(ls dist/*.whl)
          uvx --from "$wheel" chatlore --version
          uvx --from "$wheel" chatlore demo --no-serve
          uvx --from "$wheel" chatlore --home ~/.chatlore-demo search "litestream"

  falkordb:
    name: FalkorDB backend
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.20.7
        ports: ["6379:6379"]
    env:
      CHATLORE_FALKORDB_URL: redis://localhost:6379
      CHATLORE_TEST_FALKORDB_URL: redis://localhost:6379
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra falkordb

      - name: Contract tests on both stores
        run: uv run pytest tests/store

      - name: Every test with FalkorDB as the store
        run: uv run pytest
        env:
          CHATLORE_STORE: falkordb
