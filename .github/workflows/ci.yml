name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Install the wheel and try the demo
        run: |
          wheel=$(ls dist/*.whl)
          uvx --from "$wheel" chatlore --version
          uvx --from "$wheel" chatlore demo --no-serve
          uvx --from "$wheel" chatlore --home ~/.chatlore-demo search "litestream"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build
        run: docker build -t chatlore-demo .

      - name: Start it and check the web interface, API, and MCP
        run: |
          docker run -d --name demo -p 7860:7860 chatlore-demo
          for attempt in $(seq 30); do curl -fs http://127.0.0.1:7860/health && break; sleep 2; done
          curl -fs http://127.0.0.1:7860/health | grep -q '"public":true'
          curl -fs http://127.0.0.1:7860/ | grep -q '<title>ChatLore</title>'
          curl -fs http://127.0.0.1:7860/stats | grep -q '"conversations":32'
          curl -fs http://127.0.0.1:7860/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search","arguments":{"query":"litestream"}}}' \
            | grep -q 'Moving Tidewater from Postgres to SQLite'

      - name: Show the server's output
        if: always()
        run: docker logs demo || true
